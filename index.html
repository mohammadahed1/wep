<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>صنعت من أجلك · كتاب الذكريات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#050204;color:#fff;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:300;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        
        #matrix-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:10;background:#050204;will-change:transform}
        #countdown-overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
        
        #countdown-text {
            font-family: 'Aref Ruqaa', 'Amiri', serif;
            font-weight: 700;
            font-size: clamp(2.8rem, 12vw, 6.5rem);
            color: #ff2a75;
            text-shadow: 0 0 20px rgba(255, 42, 117, 0.5);
            opacity: 0;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            text-align: center;
            line-height: 1.2;
            will-change: transform, opacity;
        }
        #countdown-text.show { opacity: 1; transform: scale(1); }
        
        #enter-btn {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9); z-index: 30;
            font-family: 'Aref Ruqaa', 'Tajawal', serif; color: #ffffff;
            background: rgba(255, 42, 117, 0.25); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 22px 36px; border-radius: 50px; cursor: pointer; opacity: 0;
            pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, background 0.3s ease;
            will-change: transform, opacity;
        }
        #enter-btn.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        #enter-btn .btn-phrase { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 700; letter-spacing: 0.03em; color: #fff; text-shadow: 0 0 15px rgba(255, 42, 117, 0.8); white-space: nowrap; }
        #enter-btn .btn-sparkle { font-size: 1.2rem; color: #ff2a75; animation: spinSparkle 4s linear infinite; }
        #enter-btn:hover { transform: translate(-50%, -50%) scale(1.05); background: rgba(255, 42, 117, 0.35); }
        @keyframes spinSparkle { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #book-container {
            position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 40;
            background: radial-gradient(circle at 50% 30%, #2a0818 0%, #12040b 50%, #050204 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; overflow: hidden; transition: background 0.5s ease;
        }
        #book-container.active { display: flex; animation: fadeInBook 0.4s ease forwards; }
        @keyframes fadeInBook { 0% { opacity: 0; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
        
        #sparkle-container { position: fixed; inset: 0; pointer-events: none; z-index: 41; }
        .sparkle { position: absolute; border-radius: 50%; background: #fff; animation: floatSparkle linear infinite; opacity: 0; }
        @keyframes floatSparkle { 0% { opacity: 0; transform: translateY(100vh) scale(0.2); } 50% { opacity: 0.5; } 100% { opacity: 0; transform: translateY(-10vh) scale(0.8); } }
        
        .book-header { position: relative; z-index: 45; text-align: center; margin-bottom: 12px; }
        .book-header h1 { font-family: 'Aref Ruqaa', 'Tajawal', serif; font-size: clamp(1.6rem, 5vw, 2.5rem); color: #fff; text-shadow: 0 0 15px rgba(255,42,117,0.4); }
        .book-header .sub { font-size: 0.75rem; color: rgba(255,255,255,0.5); letter-spacing: 0.15em; margin-top: 2px; }
        
        .swiper { position: relative; z-index: 45; width: 100%; max-width: 440px; height: 62vh; max-height: 520px; }
        
        .swiper-slide {
            border-radius: 28px;
            padding: 16px 14px;
            background: rgba(25, 10, 18, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            transform: translateZ(0);
            will-change: transform;
            font-size: 16px !important;
        }

        .swiper-slide::before {
            content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 32px; height: 3.5px; border-radius: 10px; background: rgba(255, 255, 255, 0.2); z-index: 2;
        }

        .slide-header-bar {
            width: 100%; display: flex; justify-content: flex-start; align-items: center;
            margin-bottom: 6px; z-index: 30; flex-shrink: 0;
        }

        .slide-delete-btn {
            background: rgba(255, 42, 117, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff; width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; cursor: pointer; transition: transform 0.2s ease;
        }
        .slide-delete-btn:active { transform: scale(0.9); }
        
        .slide-content { 
            width: 100%; height: calc(100% - 34px); 
            display: flex; flex-direction: column; gap: 10px; align-items: center; 
            overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
        }
        .slide-content::-webkit-scrollbar { display: none; }

        .slide-content .cursive { font-family: 'Aref Ruqaa', 'Tajawal', serif; color: #ff337c; text-align: center; }
        .cursive-lg { font-size: 1.8rem; }
        .cursive-md { font-size: 1.2rem; }
        .divider-thin { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,42,117,0.5), transparent); margin: 2px auto; flex-shrink: 0; }
        
        [contenteditable="true"] { outline: none; cursor: text; border-radius: 8px; padding: 2px 4px; }
        [contenteditable="true"]:focus { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 1px rgba(255, 42, 117, 0.4); }

        .editable-text-area {
            max-height: 220px; overflow-y: auto; word-break: break-word;
            white-space: pre-wrap; line-height: 1.6;
        }

        .insta-quote-box {
            width: 100%; background: rgba(255, 255, 255, 0.95);
            color: #4a333c; border-radius: 18px; padding: 12px 15px; position: relative;
            min-height: 58px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .insta-text { font-family: inherit; font-size: 1rem; text-align: center; line-height: 1.5; color: #5a3240; width: 100%; }
        .insta-hearts { position: absolute; top: 5px; right: 10px; color: #ff337c; font-size: 0.68rem; font-weight: bold; }
        
        .insta-grid-container {
            width: 100%; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 8px; flex-shrink: 0;
        }
        
        .card-message-box {
            width: 100%; background: linear-gradient(135deg, rgba(255,245,248,0.95), rgba(255,230,238,0.92));
            border-radius: 22px; padding: 18px; text-align: center; border: 1px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; gap: 8px; margin: auto 0; max-height: 100%; overflow-y: auto;
        }
        .card-message-box.apology {
            background: linear-gradient(135deg, rgba(240,244,255,0.95), rgba(225,235,255,0.92));
        }
        .card-title { font-family: 'Aref Ruqaa', serif; font-size: 1.4rem; color: #c81e5b; flex-shrink: 0; }
        .card-message-box.apology .card-title { color: #2b529a; }
        .card-message { font-family: inherit; font-size: 1rem; color: #44333b; line-height: 1.6; }
        .card-message-box.apology .card-message { color: #2c384e; }
        .card-signature { font-size: 0.75rem; color: #ad738a; font-weight: 600; flex-shrink: 0; }
        .card-message-box.apology .card-signature { color: #627ca5; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; }
        .photo-item { position: relative; aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.05); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); border: 0; color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; }
        
        .add-photo-btn {
            aspect-ratio: 4/5; border-radius: 14px; border: 1.5px dashed rgba(255,42,117,0.4);
            background: rgba(255,42,117,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; color: rgba(255,255,255,0.7); font-size: 0.65rem; gap: 2px;
        }

        .bottom-buttons {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 55; display: none; flex-direction: row; align-items: center; gap: 10px;
            padding: 6px 14px; background: rgba(15, 6, 12, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .bottom-buttons.show { display: flex; }

        .btn-icon-soft {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff; border-radius: 50%; width: 38px; height: 38px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem;
        }
        .btn-icon-soft:active { transform: scale(0.9); background: rgba(255, 42, 117, 0.3); }

        #music-toggle.playing {
            background: rgba(255, 42, 117, 0.35); border-color: rgba(255, 42, 117, 0.6);
        }

        #settings-toggle {
            padding: 0 16px; border-radius: 20px; width: auto; font-size: 0.75rem;
            gap: 6px; font-weight: 500; font-family: 'Tajawal', sans-serif;
        }

        #close-book-btn {
            position: fixed; top: 16px; left: 16px; z-index: 56;
            width: 38px; height: 38px; border-radius: 50%; display: none;
            align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff; cursor: pointer; font-size: 1.1rem;
        }
        #close-book-btn.show { display: flex; }

        .settings-panel {
            position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%) translateY(20px);
            z-index: 50; background: rgba(20, 8, 15, 0.98); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 18px; width: 92%; max-width: 360px; display: none;
            flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease; max-height: 80vh; overflow-y: auto;
        }
        .settings-panel.open { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
        .settings-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
        .setting-row select, .setting-row input[type=color] {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,42,117,0.3);
            border-radius: 10px; padding: 4px 8px; color: #fff; font-size: 0.75rem; text-align: center;
        }
        .setting-row input[type=color] { width: 40px; height: 28px; padding: 0; border: none; cursor: pointer; border-radius: 6px; }
        .action-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
        .btn-modern {
            background: rgba(255,42,117,0.25); border: 1px solid rgba(255,42,117,0.4); color: #fff;
            padding: 8px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; text-align: center;
        }
        .btn-modern:disabled { opacity: 0.35; cursor: not-allowed; border-color: rgba(255,255,255,0.1); }
        .hidden-file-input { display: none; }

        @media(max-width: 480px) {
            .swiper { height: 58vh; max-height: 460px; }
            .swiper-slide { padding: 12px; border-radius: 22px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div id="countdown-overlay"><div id="countdown-text"></div></div>
    
    <button id="enter-btn">
        <span class="btn-sparkle">✨</span>
        <span class="btn-phrase">صفحات تُحاكي نَبْضَ قَلْبِك</span>
        <span class="btn-sparkle">✨</span>
    </button>

    <div id="book-container">
        <div id="sparkle-container"></div>
        <div class="book-header">
            <h1 dir="auto">صنعت من أجلك</h1>
            <div class="sub" dir="auto">— مجموعة من الذكريات —</div>
        </div>

        <div class="swiper" id="main-swiper">
            <div class="swiper-wrapper" id="swiper-wrapper"></div>
        </div>

        <button id="close-book-btn" title="إغلاق الكتاب">✕</button>

        <div class="bottom-buttons" id="bottom-buttons">
            <button id="music-toggle" class="btn-icon-soft" title="الموسيقى">▶</button>
            <button id="back-to-cover-btn" class="btn-icon-soft" title="الغلاف">⤒</button>
            <button id="settings-toggle" class="btn-icon-soft"><span>⚙</span><span>تخصيص</span></button>
        </div>

        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>تخصيص العرض</h3>
                <span id="settings-close-btn" style="cursor:pointer;padding:4px">✕</span>
            </div>
            
            <div class="setting-row">
                <label>نوع الخط</label>
                <select id="font-family-select">
                    <option value="Tajawal">تاجوال</option>
                    <option value="Aref Ruqaa">رقعة</option>
                    <option value="Amiri">أميري</option>
                    <option value="Cairo">القاهرة</option>
                </select>
            </div>

            <div class="setting-row">
                <label>تأثير الكتابة التدريجي</label>
                <input type="checkbox" id="typing-effect-toggle" checked style="accent-color:#ff2a75; width:18px; height:18px;" />
            </div>

            <div class="setting-row">
                <label>خلفية الموقع</label>
                <input type="color" id="bg-color-picker" value="#2a0818" />
            </div>

            <div class="setting-row">
                <label>لون خلفية الرسائل</label>
                <input type="color" id="card-color-picker" value="#fff5f8" />
            </div>

            <div class="action-buttons">
                <button class="btn-modern" id="add-love-message-btn">✉ إضافة رسالة حب (أقصى 3)</button>
                <button class="btn-modern" id="add-apology-btn" style="background:rgba(70,130,240,0.25);border-color:rgba(70,130,240,0.4)">🕊️ إضافة رسالة اعتذار (أقصى 3)</button>
                <button class="btn-modern" id="add-page-btn" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3)">✚ إضافة صفحة صور (أقصى 3)</button>
            </div>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <input type="file" id="photo-upload-input" class="hidden-file-input" accept="image/*" multiple />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        (function() {
            'use strict';

            const MAX_PER_TYPE = 3;

            const lovePresetMessages = [
                { title: 'همسة حب', message: 'أنتِ أجمل ما حدث في حياتي، وكل يوم يمر أزداد حباً لكِ. أحبكِ بجنون.', signature: 'بحبك دائماً ♥' },
                { title: 'نبض قلبي', message: 'وجودك في حياتي يجعل كل شيء أجمل، أدامكِ الله لي شيئاً جميلاً لا ينتهي.', signature: 'لكِ وحدك 💖' },
                { title: 'سر سعادتي', message: 'في عيونك أجد كل وطني، وفي حديثك ينتهي كل تعبي. أحبك بكل ما في الكلمة من معنى.', signature: 'إلى الأبد 💍' }
            ];

            const apologyPresetMessages = [
                { title: 'رسالة اعتذار', message: 'أعتذر لكِ عن أي لحظة ضايقتك فيها، مكانتك في قلبي أكبر من أي خلاف. أتمنى أن تقبلي اعتذاري.', signature: 'آسف من القلب 🕊️' },
                { title: 'من القلب إلى القلب', message: 'لم أكن أقصد إحزانكِ أبداً، فرحتك هي أملي الوحيد. سامحيني يا أرق الناس.', signature: 'مع كل اعتذاري 💙' },
                { title: 'صفحة جديدة', message: 'كل لحظة بدون رضاكِ تبدو ثقيلة، دعنا نتجاوز ما كان ونبدأ صفحة مليئة بالحب والسلام.', signature: 'أعتذر بصدق 🌿' }
            ];

            const instaPresetQuotes = [
                "طالما أنتِ تبتسمين، أنا سعيد. ابقي سعيدة يا حبيبتي.",
                "بعض اللحظات لا تُمحى من الذاكرة، خصوصاً عندما تكون معكِ.",
                "كل صورة تجمعنا هي حكاية عشق لا تنتهي."
            ];

            let loveIndex = 0;
            let apologyIndex = 0;
            let instaIndex = 0;

            // ===== MATRIX BACKGROUND =====
            (function matrixRain() {
                const canvas = document.getElementById('matrix-canvas');
                const ctx = canvas.getContext('2d', { alpha: false });
                let W, H, active = true, frameId = null, lastTime = 0;
                const chars = '0123456789♥♡❤';
                let drops = [];

                function resize() {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                    const cols = Math.floor(W / 18);
                    drops = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -50));
                }

                function draw(time) {
                    if (!active) return;
                    frameId = requestAnimationFrame(draw);
                    // خفض معدل تحديث الخفيّة إلى 30fps للحفاظ على سرعة المعالج
                    if (time - lastTime < 33) return; 
                    lastTime = time;

                    ctx.fillStyle = 'rgba(5,2,4,0.15)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.font = '12px monospace';
                    for (let i = 0; i < drops.length; i++) {
                        const y = drops[i] * 18;
                        ctx.fillStyle = '#ff2a75';
                        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 18, y);
                        if (y > H && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                }

                window.stopMatrix = function() { active = false; if (frameId) cancelAnimationFrame(frameId); canvas.style.display = 'none'; };
                window.startMatrix = function() { active = true; canvas.style.display = 'block'; requestAnimationFrame(draw); };

                window.addEventListener('resize', resize, { passive: true });
                resize(); requestAnimationFrame(draw);
            })();

            let bookData = {
                slides: [
                    { type: 'cover', title: 'ذكرياتنا الخاصة', recipient: 'محمد أحمد', emojis: ['🌙', '✨'] },
                    { type: 'love_message', title: 'رسالة حب', message: 'أنتِ أجمل ما حدث في حياتي، وكل يوم يمر أزداد حباً لكِ. أحبكِ بجنون.', signature: 'بحبك دائماً ♥' },
                    { type: 'apology_message', title: 'رسالة اعتذار', message: 'أعتذر لكِ عن أي لحظة ضايقتك فيها، مكانتك في قلبي أكبر من أي خلاف. أتمنى أن تقبلي اعتذاري.', signature: 'آسف من القلب 🕊️' },
                    { type: 'insta_card', content: "طالما أنتِ تبتسمين، أنا سعيد. ابقي سعيدة يا حبيبتي.", photos: [
                            { id: 'p1', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80' },
                            { id: 'p2', url: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80' }
                        ] },
                    { type: 'final', title: 'للأبد', message: '"أنتِ يومي وكل غدي."' }
                ],
                settings: { fontFamily: 'Tajawal', typingEffect: true, bgColor: '#2a0818', cardColor: '#fff5f8' }
            };

            function loadSavedData() {
                try { const saved = localStorage.getItem('memoryBookData_v6'); if (saved) bookData = JSON.parse(saved); } catch (e) {}
            }
            
            // Debounce لعدم الكتابة المفرطة في LocalStorage عند التعديل النصي
            let saveTimeout;
            function saveData() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    try { localStorage.setItem('memoryBookData_v6', JSON.stringify(bookData)); } catch (e) {}
                }, 400);
                updateAddButtonStates();
            }

            function esc(str = '') { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

            function renderPhotoGrid(photos = [], slideIndex) {
                let html = `<div class="photo-grid">`;
                photos.forEach((photo, idx) => {
                    html += `<div class="photo-item"><img src="${photo.url}" alt="صورة" loading="lazy"><button class="delete-btn" onclick="deletePhoto(${slideIndex},${idx})">✕</button></div>`;
                });
                if (photos.length < 2) html += `<div class="add-photo-btn" onclick="triggerUpload(${slideIndex})"><span style="font-size:1rem">+</span><span>إضافة</span></div>`;
                return html + '</div>';
            }

            function renderSlides() {
                const wrapper = document.getElementById('swiper-wrapper');
                wrapper.innerHTML = '';
                bookData.slides.forEach((slide, index) => {
                    const div = document.createElement('div');
                    div.className = 'swiper-slide';
                    div.dataset.index = index;

                    let headerBarHtml = '';
                    if (slide.type !== 'cover' && slide.type !== 'final') {
                        headerBarHtml = `<div class="slide-header-bar"><button class="slide-delete-btn" onclick="deleteSlide(${index})" title="حذف هذا التبويب">✕</button></div>`;
                    }
                    
                    if (slide.type === 'cover') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center;text-align:center">
                            <h2 class="cursive cursive-lg" contenteditable="true" data-field="title" dir="auto">${esc(slide.title)}</h2><div class="divider-thin"></div>
                            <p class="cursive cursive-md" contenteditable="true" data-field="recipient" dir="auto">إلى ${esc(slide.recipient)}</p>
                            <div style="margin-top:6px;display:flex;gap:8px">${slide.emojis.map(e=>`<span style="font-size:1.3rem;opacity:.6">${e}</span>`).join('')}</div>
                        </div>`;
                    } else if (slide.type === 'love_message') {
                        div.innerHTML = `${headerBarHtml}<div class="slide-content"><div class="card-message-box" style="background:${bookData.settings.cardColor || '#fff5f8'}">
                            <div class="card-title" contenteditable="true" data-field="title" dir="auto">${esc(slide.title)}</div>
                            <div class="card-message editable-text-area typing-target" contenteditable="true" data-field="message" data-text="${esc(slide.message)}" dir="auto">${esc(slide.message)}</div>
                            <div class="card-signature" contenteditable="true" data-field="signature" dir="auto">${esc(slide.signature||'')}</div>
                        </div></div>`;
                    } else if (slide.type === 'apology_message') {
                        div.innerHTML = `${headerBarHtml}<div class="slide-content"><div class="card-message-box apology">
                            <div class="card-title" contenteditable="true" data-field="title" dir="auto">${esc(slide.title)}</div>
                            <div class="card-message editable-text-area typing-target" contenteditable="true" data-field="message" data-text="${esc(slide.message)}" dir="auto">${esc(slide.message)}</div>
                            <div class="card-signature" contenteditable="true" data-field="signature" dir="auto">${esc(slide.signature||'')}</div>
                        </div></div>`;
                    } else if (slide.type === 'insta_card') {
                        div.innerHTML = `${headerBarHtml}<div class="slide-content">
                            <div class="insta-quote-box"><div class="insta-hearts">أحبك</div>
                            <div class="insta-text editable-text-area typing-target" contenteditable="true" data-field="content" data-text="${esc(slide.content)}" dir="auto">${esc(slide.content)}</div></div>
                            <div class="insta-grid-container">${renderPhotoGrid(slide.photos,index)}</div>
                        </div>`;
                    } else if (slide.type === 'final') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center;text-align:center">
                            <h2 class="cursive cursive-lg" contenteditable="true" data-field="title" dir="auto">${esc(slide.title)}</h2><div class="divider-thin"></div>
                            <p class="insta-text editable-text-area typing-target" contenteditable="true" data-field="message" data-text="${esc(slide.message)}" dir="auto" style="color:#fff;font-size:1rem">${esc(slide.message)}</p>
                        </div>`;
                    }
                    wrapper.appendChild(div);
                });

                bindEditEvents();
                applySettings();
                updateAddButtonStates();
            }

            function updateAddButtonStates() {
                const loveCount = bookData.slides.filter(s => s.type === 'love_message').length;
                const apologyCount = bookData.slides.filter(s => s.type === 'apology_message').length;
                const photoCount = bookData.slides.filter(s => s.type === 'insta_card').length;

                document.getElementById('add-love-message-btn').disabled = loveCount >= MAX_PER_TYPE;
                document.getElementById('add-apology-btn').disabled = apologyCount >= MAX_PER_TYPE;
                document.getElementById('add-page-btn').disabled = photoCount >= MAX_PER_TYPE;
            }

            window.deleteSlide = function(index) {
                if (bookData.slides.length <= 2) return;
                bookData.slides.splice(index, 1);
                saveData();
                renderSlides();
                initSwiper();
                const targetIndex = Math.max(0, index - 1);
                if (swiperInstance) swiperInstance.slideTo(targetIndex);
            };

            function bindEditEvents() {
                document.querySelectorAll('.swiper-slide [contenteditable="true"]').forEach(el => {
                    el.addEventListener('input', function() {
                        const slideIndex = +this.closest('.swiper-slide').dataset.index;
                        const field = this.dataset.field;
                        let val = this.innerText;
                        
                        if (bookData.slides[slideIndex]) {
                            bookData.slides[slideIndex][field] = val;
                            if (this.classList.contains('typing-target')) {
                                this.setAttribute('data-text', val);
                            }
                            saveData();
                        }
                    });
                });
            }

            // تحسين الكتابة التدريجية باستخدام requestAnimationFrame لمنع التهنيج
            function typeText(element, text) {
                element.textContent = '';
                let i = 0;
                let lastCharTime = 0;

                if(element.typingRaf) cancelAnimationFrame(element.typingRaf);

                function step(timestamp) {
                    if (!lastCharTime) lastCharTime = timestamp;
                    if (timestamp - lastCharTime > 35) {
                        if (i < text.length) {
                            element.textContent += text.charAt(i);
                            i++;
                            lastCharTime = timestamp;
                        } else {
                            return;
                        }
                    }
                    element.typingRaf = requestAnimationFrame(step);
                }
                element.typingRaf = requestAnimationFrame(step);
            }

            function triggerTypingForSlide(slideEl) {
                if (!bookData.settings.typingEffect) return;
                const targets = slideEl.querySelectorAll('.typing-target');
                targets.forEach(target => {
                    if (document.activeElement === target) return;
                    const text = target.getAttribute('data-text') || target.textContent;
                    typeText(target, text);
                });
            }

            let swiperInstance = null;

            function initSwiper() {
                if (swiperInstance) swiperInstance.destroy(true, true);
                swiperInstance = new Swiper('.swiper', {
                    effect: 'cards',
                    grabCursor: true,
                    cardsEffect: { perSlideOffset: 5, perSlideRotate: 2 },
                    speed: 300,
                    on: {
                        slideChange: function() {
                            updateBackToCoverButton();
                            const activeSlide = this.slides[this.activeIndex];
                            if (activeSlide) triggerTypingForSlide(activeSlide);
                        }
                    }
                });
                if (swiperInstance.slides[0]) triggerTypingForSlide(swiperInstance.slides[0]);
            }

            function updateBackToCoverButton() {
                const btn = document.getElementById('back-to-cover-btn');
                if (swiperInstance) btn.style.display = (swiperInstance.activeIndex > 0) ? 'flex' : 'none';
            }

            document.getElementById('back-to-cover-btn').onclick = function() {
                if (swiperInstance) swiperInstance.slideTo(0);
            };

            window.triggerUpload = function(slideIndex) {
                const input = document.getElementById('photo-upload-input');
                input.dataset.slide = slideIndex; input.click();
            };

            // تقليل حجم الصورة المرفوعة لتفادي استهلاك الذاكرة وتجميد الصفحة
            function resizeImage(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 600;

                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            document.getElementById('photo-upload-input').addEventListener('change', function(e) {
                const slideIndex = +this.dataset.slide;
                if (!e.target.files.length) return;
                
                Array.from(e.target.files).forEach(file => {
                    resizeImage(file, function(resizedUrl) {
                        const slide = bookData.slides[slideIndex];
                        if (!slide) return;
                        slide.photos = slide.photos || [];
                        if (slide.photos.length < 2) {
                            slide.photos.push({ url: resizedUrl });
                            saveData(); renderSlides(); initSwiper();
                            swiperInstance.slideTo(slideIndex);
                        }
                    });
                });
                this.value = '';
            });

            window.deletePhoto = function(slideIndex, photoIdx) {
                bookData.slides[slideIndex].photos.splice(photoIdx, 1);
                saveData(); renderSlides(); initSwiper();
                swiperInstance.slideTo(slideIndex);
            };

            const panel = document.getElementById('settings-panel');
            document.getElementById('settings-toggle').onclick = () => panel.classList.toggle('open');
            document.getElementById('settings-close-btn').onclick = () => panel.classList.remove('open');

            function applySettings() {
                const s = bookData.settings;
                document.querySelectorAll('.swiper-slide').forEach(slide => {
                    slide.style.fontFamily = `'${s.fontFamily}', sans-serif`;
                });

                const container = document.getElementById('book-container');
                if (s.bgColor) {
                    container.style.background = `radial-gradient(circle at 50% 30%, ${s.bgColor} 0%, #050204 100%)`;
                }

                document.querySelectorAll('.card-message-box:not(.apology)').forEach(card => {
                    if (s.cardColor) card.style.background = s.cardColor;
                });

                document.getElementById('font-family-select').value = s.fontFamily || 'Tajawal';
                document.getElementById('typing-effect-toggle').checked = !!s.typingEffect;
                document.getElementById('bg-color-picker').value = s.bgColor || '#2a0818';
                document.getElementById('card-color-picker').value = s.cardColor || '#fff5f8';
            }

            document.getElementById('font-family-select').onchange = function() {
                bookData.settings.fontFamily = this.value; applySettings(); saveData();
            };

            document.getElementById('typing-effect-toggle').onchange = function() {
                bookData.settings.typingEffect = this.checked; saveData();
            };

            document.getElementById('bg-color-picker').oninput = function() {
                bookData.settings.bgColor = this.value; applySettings(); saveData();
            };

            document.getElementById('card-color-picker').oninput = function() {
                bookData.settings.cardColor = this.value; applySettings(); saveData();
            };

            document.getElementById('add-love-message-btn').onclick = function() {
                const currentCount = bookData.slides.filter(s => s.type === 'love_message').length;
                if (currentCount >= MAX_PER_TYPE) return;
                const preset = lovePresetMessages[loveIndex % lovePresetMessages.length];
                loveIndex++;
                bookData.slides.splice(bookData.slides.length - 1, 0, { 
                    type: 'love_message', title: preset.title, message: preset.message, signature: preset.signature 
                });
                saveData(); renderSlides(); initSwiper();
                swiperInstance.slideTo(bookData.slides.length - 2);
            };

            document.getElementById('add-apology-btn').onclick = function() {
                const currentCount = bookData.slides.filter(s => s.type === 'apology_message').length;
                if (currentCount >= MAX_PER_TYPE) return;
                const preset = apologyPresetMessages[apologyIndex % apologyPresetMessages.length];
                apologyIndex++;
                bookData.slides.splice(bookData.slides.length - 1, 0, { 
                    type: 'apology_message', title: preset.title, message: preset.message, signature: preset.signature 
                });
                saveData(); renderSlides(); initSwiper();
                swiperInstance.slideTo(bookData.slides.length - 2);
            };

            document.getElementById('add-page-btn').onclick = function() {
                const currentCount = bookData.slides.filter(s => s.type === 'insta_card').length;
                if (currentCount >= MAX_PER_TYPE) return;
                const quote = instaPresetQuotes[instaIndex % instaPresetQuotes.length];
                instaIndex++;
                bookData.slides.splice(bookData.slides.length - 1, 0, { 
                    type: 'insta_card', content: quote, photos: [] 
                });
                saveData(); renderSlides(); initSwiper();
                swiperInstance.slideTo(bookData.slides.length - 2);
            };

            function generateSparkles() {
                const container = document.getElementById('sparkle-container');
                container.innerHTML = '';
                for (let i = 0; i < 8; i++) {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
                    s.style.left = Math.random() * 100 + '%';
                    s.style.animationDuration = (Math.random() * 8 + 5) + 's';
                    container.appendChild(s);
                }
            }

            function runCountdown() {
                const el = document.getElementById('countdown-text');
                const btn = document.getElementById('enter-btn');
                btn.classList.remove('show');
                el.style.opacity = '1';
                const seq = ['٣', '٢', '١', 'أحبك'];
                let i = 0;

                function next() {
                    if (i >= seq.length) {
                        el.style.opacity = '0';
                        setTimeout(() => { btn.classList.add('show'); }, 200);
                        return;
                    }
                    el.textContent = seq[i++];
                    el.classList.remove('show');
                    void el.offsetWidth;
                    el.classList.add('show');
                    setTimeout(next, 700);
                }
                setTimeout(next, 100);
            }

            const music = document.getElementById('backgroundMusic');
            const musicBtn = document.getElementById('music-toggle');
            musicBtn.onclick = function(e) {
                e.stopPropagation();
                if (music.paused) {
                    music.play().then(() => { musicBtn.textContent = '❚❚'; musicBtn.classList.add('playing'); }).catch(() => {});
                } else {
                    music.pause(); musicBtn.textContent = '▶'; musicBtn.classList.remove('playing');
                }
            };

            document.getElementById('enter-btn').onclick = function() {
                this.classList.remove('show');
                window.stopMatrix();
                document.getElementById('book-container').classList.add('active');
                document.getElementById('close-book-btn').classList.add('show');
                document.getElementById('bottom-buttons').classList.add('show');
                generateSparkles(); renderSlides(); initSwiper();
            };

            document.getElementById('close-book-btn').onclick = function() {
                music.pause(); musicBtn.textContent = '▶'; musicBtn.classList.remove('playing');
                document.getElementById('book-container').classList.remove('active');
                this.classList.remove('show');
                document.getElementById('bottom-buttons').classList.remove('show');
                panel.classList.remove('open');
                window.startMatrix(); runCountdown();
            };

            loadSavedData(); runCountdown();
        })();
    </script>
</body>
</html>
