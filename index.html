<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>صنعت من أجلك · كتاب الذكريات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#060204;color:#fff;font-family:'Tajawal','Inter',sans-serif;font-weight:300;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        #matrix-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:10;background:#060204}
        #countdown-overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
        #countdown-text{font-family:'Playfair Display',serif;font-weight:300;font-size:clamp(3rem,14vw,8rem);color:#ff2a75;text-shadow:0 0 80px rgba(255,42,117,.3),0 0 160px rgba(255,42,117,.1);opacity:0;transform:scale(.7) translateY(20px);transition:all 1.2s cubic-bezier(.23,1,.32,1);letter-spacing:.12em;text-align:center;line-height:1.1}
        #countdown-text.show{opacity:1;transform:scale(1) translateY(0)}
        #enter-btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;font-family:'Tajawal','Inter',sans-serif;font-weight:500;font-size:clamp(1.1rem,4vw,1.8rem);color:#fff;background:linear-gradient(135deg,rgba(255,42,117,.9),rgba(180,20,80,.85));border:0;padding:16px 40px;border-radius:60px;cursor:pointer;opacity:0;transition:all .5s cubic-bezier(.23,1,.32,1);letter-spacing:.05em;display:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(255,42,117,.5),0 8px 30px rgba(0,0,0,.5);min-height:60px;max-width:90vw;white-space:nowrap;text-align:center;touch-action:manipulation}
        #enter-btn.show{display:block;opacity:1;animation:btnBreath 3s ease-in-out infinite}
        @keyframes btnBreath{0%,100%{box-shadow:0 0 30px rgba(255,42,117,.4),0 8px 20px rgba(0,0,0,.4);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 60px rgba(255,42,117,.8),0 8px 30px rgba(0,0,0,.6);transform:translate(-50%,-50%) scale(1.05)}}
        #enter-btn:hover{transform:translate(-50%,-50%) scale(1.05);background:linear-gradient(135deg,#ff3c82,#c81e5a);box-shadow:0 0 60px rgba(255,42,117,.9)}
        #enter-btn:active{transform:translate(-50%,-50%) scale(.98)}
        #book-container{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;background:radial-gradient(ellipse at 50% 60%,#0d060a,#060204);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:hidden}
        #book-container.active{display:flex;animation:bookReveal 1.2s cubic-bezier(.23,1,.32,1) forwards}
        @keyframes bookReveal{0%{opacity:0;transform:scale(.92) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        #sparkle-container{position:fixed;inset:0;width:100vw;height:100vh;z-index:41;pointer-events:none;overflow:hidden}
        .sparkle{position:absolute;border-radius:50%;animation:sparkleDrift linear infinite;opacity:0;background:#fff}
        @keyframes sparkleDrift{0%{opacity:0;transform:translateY(100vh) scale(.1)}15%{opacity:.6}85%{opacity:.3}100%{opacity:0;transform:translateY(-20vh) scale(.5)}}
        .book-header{position:relative;z-index:45;text-align:center;margin-bottom:6px;padding:0 12px;width:100%;max-width:560px}
        .book-header h1{font-family:'Playfair Display','Tajawal',serif;font-weight:700;font-size:clamp(1.8rem,5vw,3.5rem);color:rgba(255,42,117,.7);letter-spacing:.06em;line-height:1.1;font-style:italic;display:inline-block}
        .book-header .sub{font-size:clamp(.65rem,1.2vw,.85rem);color:rgba(255,255,255,.25);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
        
        .swiper{position:relative;z-index:45;width:90vw;max-width:420px;height:65vh;max-height:580px;padding:10px 0}
        .swiper-slide{display:flex;flex-direction:column;border-radius:24px;padding:16px 14px;background:rgba(18,8,14,.88);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,42,117,.12);box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);overflow-y:auto;height:100%;transition:border-color .4s ease;-webkit-overflow-scrolling:touch}
        .slide-content{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:4px;align-items:center;-webkit-overflow-scrolling:touch}
        .slide-content .cursive{font-family:'Tajawal','Great Vibes',cursive;color:#ff2a75;text-align:center;line-height:1.2}
        .cursive-lg{font-size:clamp(1.8rem,5vw,3rem);opacity:.9}
        .cursive-md{font-size:clamp(1.1rem,3vw,1.8rem);opacity:.75}
        .divider-thin{width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,42,117,.3),transparent);margin:2px auto}
        .insta-quote-box{width:100%;background:#fbf5f3;color:#523e44;border-radius:18px;padding:16px 14px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;min-height:90px}
        .insta-text{font-family:'Great Vibes','Tajawal',cursive,serif;font-size:clamp(1rem,2.5vw,1.4rem);text-align:center;line-height:1.5;color:#724c58;outline:none;width:100%;white-space:pre-wrap;unicode-bidi:plaintext}
        .insta-hearts{position:absolute;top:10px;right:14px;color:#ff528a;font-size:.8rem;pointer-events:none;font-family:'Great Vibes',cursive}
        .insta-grid-container{width:100%;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.8);border-radius:18px;padding:8px;box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .love-message-card{width:100%;max-width:360px;margin:0 auto;background:linear-gradient(145deg,#fff5f7,#ffe8ef);border-radius:20px;padding:20px 16px;box-shadow:0 15px 40px rgba(255,42,117,.2);border:2px solid rgba(255,42,117,.3);position:relative;overflow:hidden;text-align:center}
        .love-message-card:before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,42,117,.08) 20%,transparent 70%);animation:floatHearts 10s linear infinite}
        @keyframes floatHearts{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .love-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2.1rem);color:#c81e5b;margin-bottom:8px;position:relative;z-index:1}
        .love-message{font-family:'Great Vibes','Tajawal',cursive;font-size:clamp(1.1rem,3vw,1.5rem);color:#5c3e4a;line-height:1.6;position:relative;z-index:1;white-space:pre-wrap;outline:none;min-height:80px}
        .love-signature{font-size:.85rem;color:#b8869a;margin-top:10px;position:relative;z-index:1}
        .typewriter-cursor{display:inline-block;width:2px;height:1em;background:#ff2a75;margin:0 2px;vertical-align:middle;animation:blinkCursor .8s infinite}
        @keyframes blinkCursor{0%,100%{opacity:1}50%{opacity:0}}
        .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
        .photo-item{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05)}
        .photo-item.pop{animation:photoPopIn .6s cubic-bezier(.34,1.56,.64,1) forwards}
        @keyframes photoPopIn{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
        .photo-item img{width:100%;height:100%;object-fit:cover}
        .delete-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:0;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:0;z-index:5}
        .photo-item:hover .delete-btn{opacity:1}
        .add-photo-btn{aspect-ratio:4/5;border-radius:10px;border:2px dashed rgba(255,42,117,.3);background:rgba(255,42,117,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.6);font-size:.7rem;gap:4px}
        .add-photo-btn:hover{border-color:rgba(255,42,117,.6);background:rgba(255,42,117,.1);color:#fff}
        
        .btn-glass {
            background: linear-gradient(135deg, rgba(255,42,117,.2), rgba(15,6,12,.8));
            border: 1px solid rgba(255,42,117,.35);
            color: #fff;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all .3s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-glass:hover {
            background: linear-gradient(135deg, rgba(255,42,117,.35), rgba(15,6,12,.9));
            border-color: rgba(255,42,117,.6);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,42,117,.25);
        }
        .btn-glass:active { transform: scale(.94); }

        #music-toggle { position: fixed; bottom: 20px; left: 20px; z-index: 55; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; display: none; padding: 0; }
        #music-toggle.show { display: flex; }
        #music-toggle.playing { border-color: rgba(255,42,117,.7); box-shadow: 0 0 40px rgba(255,42,117,.25), inset 0 0 20px rgba(255,42,117,.05); animation: musicPulse 2s ease-in-out infinite; }
        @keyframes musicPulse { 0%,100% { box-shadow: 0 0 20px rgba(255,42,117,.15), 0 4px 20px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 50px rgba(255,42,117,.35), 0 4px 30px rgba(0,0,0,.5); } }

        #settings-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 55; border-radius: 50px; padding: 8px 18px; font-size: .8rem; font-family: 'Tajawal','Inter',sans-serif; display: none; gap: 6px; }
        #settings-toggle.show { display: flex; }

        #back-to-cover-btn { position: fixed; bottom: 75px; right: 20px; z-index: 55; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; display: none; padding: 0; }
        #back-to-cover-btn.show { display: flex; }

        #close-book-btn { position: fixed; top: 16px; right: 16px; z-index: 55; border-radius: 30px; padding: 6px 16px; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-family: 'Tajawal',sans-serif; display: none; gap: 4px; }
        #close-book-btn.show { display: flex; }
        #close-book-btn::before { content: "✕"; margin-left: 4px; }

        .settings-panel { position: fixed; bottom: 75px; right: 20px; z-index: 50; background: rgba(16,8,14,.94); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255,42,117,.3); border-radius: 20px; padding: 18px; width: 290px; display: none; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.9); }
        .settings-panel.open { display: flex; animation: panelFadeIn .4s ease forwards; }
        @keyframes panelFadeIn { 0% { opacity:0; transform: translateY(20px) scale(.95); } 100% { opacity:1; transform: translateY(0) scale(1); } }
        .settings-header, .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .settings-header h3, .setting-row label { font-size: .75rem; color: rgba(255,255,255,.7); font-weight: 400; }
        .settings-close-btn { background: none; border: 0; color: #aaa; cursor: pointer; font-size: 1.1rem; }
        .setting-row select, .setting-row input[type=number] { background: rgba(255,255,255,.05); border: 1px solid rgba(255,42,117,.2); border-radius: 10px; padding: 4px 8px; color: #fff; font-family: 'Tajawal',sans-serif; font-size: .7rem; outline: none; }
        .setting-row input[type=color] { border:0; width:30px; height:30px; border-radius:50%; cursor:pointer; background:none; }
        .action-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; border-top:1px solid rgba(255,255,255,.08); padding-top:10px; }
        .btn-modern { background: linear-gradient(135deg, rgba(255,42,117,.25), rgba(255,42,117,.05)); border: 1px solid rgba(255,42,117,.35); color: #fff; padding: 7px 14px; border-radius: 12px; cursor: pointer; font-family: 'Tajawal','Inter',sans-serif; font-size: .7rem; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all .3s ease; }
        .btn-modern:hover { background: linear-gradient(135deg, rgba(255,42,117,.4), rgba(255,42,117,.15)); border-color: rgba(255,42,117,.6); transform: scale(1.02); }
        .btn-modern-danger { background: linear-gradient(135deg, rgba(255,50,50,.2), rgba(200,0,0,.05)); border-color: rgba(255,50,50,.3); color: #ffb3b3; }
        .btn-modern-danger:hover { background: linear-gradient(135deg, rgba(255,50,50,.35), rgba(200,0,0,.1)); border-color: rgba(255,50,50,.5); }

        .hidden-file-input { display: none; }

        @media(max-width:600px) {
            .swiper { width: 88vw; height: 68vh; }
            .settings-panel { right: 10px; bottom: 70px; width: calc(100vw - 20px); max-width: 300px; }
            #settings-toggle { right: 10px; bottom: 10px; }
            #music-toggle { left: 10px; bottom: 10px; }
            #back-to-cover-btn { right: 10px; bottom: 65px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div id="countdown-overlay"><div id="countdown-text"></div></div>
    <button id="enter-btn">افتح كتاب الذكريات</button>

    <div id="book-container">
        <div id="sparkle-container"></div>
        <div class="book-header">
            <h1 dir="auto">صنعت من أجلك</h1>
            <div class="sub" dir="auto">— مجموعة من الذكريات —</div>
        </div>

        <div class="swiper" id="main-swiper">
            <div class="swiper-wrapper" id="swiper-wrapper"></div>
        </div>

        <button id="music-toggle" class="btn-glass" title="تشغيل / إيقاف الموسيقى">▶</button>
        <button id="settings-toggle" class="btn-glass"><span>⚙</span> <span class="label-text">تخصيص</span></button>
        <button id="back-to-cover-btn" class="btn-glass" title="العودة للغلاف">⤒</button>
        <button id="close-book-btn" class="btn-glass">إغلاق</button>

        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>الإعدادات</h3>
                <button class="settings-close-btn" id="settings-close-btn">✕</button>
            </div>
            <div class="setting-row">
                <label>حجم الخط</label>
                <input type="number" id="font-size-slider" value="16" min="12" max="24" />
            </div>
            <div class="setting-row">
                <label>نوع الخط</label>
                <select id="font-family-select">
                    <option value="Tajawal">تاجوال (العربية)</option>
                    <option value="Inter">إنتر</option>
                    <option value="Playfair Display">بلايفير</option>
                    <option value="Great Vibes">جريت فايبس</option>
                </select>
            </div>
            <div class="setting-row">
                <label>لون الخلفية</label>
                <input type="color" id="bg-color-picker" value="#0d060a" />
            </div>
            <div class="action-buttons">
                <button class="btn-modern" id="add-page-btn">✚ إضافة صفحة جديدة</button>
                <button class="btn-modern" id="add-love-message-btn">✉ إضافة رسالة حب</button>
                <button class="btn-modern btn-modern-danger" id="remove-page-btn">━ حذف آخر صفحة</button>
                <button class="btn-modern" id="replay-typewriter-btn">↺ إعادة تأثير الكتابة</button>
            </div>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <input type="file" id="photo-upload-input" class="hidden-file-input" accept="image/*" multiple />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        (function() {
            'use strict';

            // مطر الكود Matrix
            (function matrixRain() {
                const canvas = document.getElementById('matrix-canvas');
                const ctx = canvas.getContext('2d');
                let W, H, active = true, frameId = null;
                const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ♥♡❤';
                let drops = [];
                const COLUMN_WIDTH = 14;
                let columns = 0;

                function resize() {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                    columns = Math.floor(W / COLUMN_WIDTH);
                    resetDrops();
                }

                function resetDrops() {
                    drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -100));
                }

                function draw() {
                    if (!active) return;
                    ctx.fillStyle = 'rgba(6,2,4,.05)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.font = '12px monospace';
                    for (let i = 0; i < drops.length; i++) {
                        const y = drops[i] * COLUMN_WIDTH;
                        ctx.fillStyle = `rgba(255,42,117,${Math.random() * 0.5 + 0.2})`;
                        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * COLUMN_WIDTH, y);
                        if (y > H && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                    frameId = requestAnimationFrame(draw);
                }

                window.stopMatrix = function() {
                    active = false;
                    if (frameId) { cancelAnimationFrame(frameId); frameId = null; }
                    canvas.style.display = 'none';
                };
                window.startMatrix = function() {
                    if (active) return;
                    active = true;
                    canvas.style.display = 'block';
                    draw();
                };

                window.addEventListener('resize', resize, { passive: true });
                resize();
                draw();
            })();

            // بيانات الكتاب
            let bookData = {
                slides: [
                    { type: 'cover', title: 'ذكرياتنا الخاصة', recipient: 'محمد أحمد', emojis: ['🌙', '✨'] },
                    { type: 'love_message', title: 'رسالة حب', message: 'أنتِ أجمل ما حدث في حياتي، وكل يوم يمر أزداد حباً لكِ. أحبكِ بجنون.', signature: 'بحبك دائماً ♥' },
                    { type: 'insta_card', content: "طالما أنتِ تبتسمين، أنا سعيد. ابقي سعيدة يا حبيبتي.", photos: [
                            { id: 'p1', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80' },
                            { id: 'p2', url: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80' }
                        ] },
                    { type: 'insta_card', content: 'كل لحظة معك هي ذكرى جميـلة لا تُنسى..', photos: [
                            { id: 'p3', url: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80' }
                        ] },
                    { type: 'final', title: 'للأبد', message: '"أنتِ يومي وكل غدي."' }
                ],
                settings: { fontSize: 16, fontFamily: 'Tajawal', backgroundColor: '#0d060a' }
            };

            function loadSavedData() {
                try { const saved = localStorage.getItem('memoryBookData'); if (saved) bookData = JSON.parse(saved); } catch (e) {}
                syncSettingsUI();
            }

            function saveData() {
                try { localStorage.setItem('memoryBookData', JSON.stringify(bookData)); } catch (e) {}
            }

            // كتابة بالآلة الكاتبة
            let typewriterTimeouts = [];

            function clearTypewriterTimeouts() {
                typewriterTimeouts.forEach(t => clearTimeout(t));
                typewriterTimeouts = [];
            }

            function typeWriter(el, text, speed = 35) {
                clearTypewriterTimeouts();
                el.innerHTML = '';
                const span = document.createElement('span');
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                el.append(span, cursor);
                let i = 0;

                function type() {
                    if (i < text.length) {
                        span.textContent += text[i++];
                        typewriterTimeouts.push(setTimeout(type, speed));
                    } else {
                        setTimeout(() => cursor.remove(), 2000);
                    }
                }
                type();
            }

            function triggerTypewriterOnActiveSlide() {
                if (!swiperInstance) return;
                const slides = document.querySelectorAll('.swiper-slide');
                const active = slides[swiperInstance.activeIndex];
                if (!active) return;
                active.querySelectorAll('.typewriter-text').forEach(el => {
                    const fullText = el.dataset.fulltext || el.innerText;
                    typeWriter(el, fullText);
                });
            }

            function esc(str = '') {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function renderPhotoGrid(photos = [], slideIndex) {
                let html = `<div class="photo-grid" data-slide="${slideIndex}">`;
                photos.forEach((photo, idx) => {
                    const isEmoji = photo.url && photo.url.length <= 2;
                    html += `<div class="photo-item pop">${isEmoji?`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem">${photo.url}</div>`:`<img src="${photo.url}" alt="صورة ذكرى" loading="lazy">`}<button class="delete-btn" onclick="deletePhoto(${slideIndex},${idx})">✕</button></div>`;
                });
                if (photos.length < 2) html += `<div class="add-photo-btn" onclick="triggerUpload(${slideIndex})"><span style="font-size:1.5rem">+</span><span>إضافة صورة</span></div>`;
                return html + '</div>';
            }

            function renderSlides() {
                const wrapper = document.getElementById('swiper-wrapper');
                wrapper.innerHTML = '';
                bookData.slides.forEach((slide, index) => {
                    const div = document.createElement('div');
                    div.className = 'swiper-slide';
                    div.dataset.index = index;
                    if (slide.type === 'cover') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center;align-items:center;text-align:center">
                            <h2 class="cursive cursive-lg" dir="auto">${esc(slide.title)}</h2><div class="divider-thin"></div>
                            <p class="cursive cursive-md" dir="auto">إلى ${esc(slide.recipient)}</p>
                            <div style="margin-top:10px;display:flex;gap:12px">${slide.emojis.map(e=>`<span style="font-size:2rem;opacity:.4">${e}</span>`).join('')}</div>
                        </div>`;
                    } else if (slide.type === 'love_message') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center"><div class="love-message-card">
                            <div class="love-title" contenteditable="true" dir="auto">${esc(slide.title)}</div>
                            <div class="love-message typewriter-text" contenteditable="true" dir="auto" data-fulltext="${esc(slide.message)}">${esc(slide.message)}</div>
                            <div class="love-signature" contenteditable="true" dir="auto">${esc(slide.signature||'')}</div>
                        </div></div>`;
                    } else if (slide.type === 'insta_card') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center">
                            <div class="insta-quote-box"><div class="insta-hearts">حب</div>
                            <div class="insta-text typewriter-text" contenteditable="true" dir="auto" data-fulltext="${esc(slide.content)}">${esc(slide.content)}</div></div>
                            <div class="insta-grid-container">${renderPhotoGrid(slide.photos,index)}</div>
                        </div>`;
                    } else if (slide.type === 'final') {
                        div.innerHTML = `<div class="slide-content" style="justify-content:center;align-items:center;text-align:center">
                            <h2 class="cursive cursive-lg" dir="auto">${esc(slide.title)}</h2><div class="divider-thin"></div>
                            <p class="insta-text typewriter-text" contenteditable="true" dir="auto" data-fulltext="${esc(slide.message)}" style="color:#fff;font-size:1.2rem">${esc(slide.message)}</p>
                        </div>`;
                    }
                    wrapper.appendChild(div);
                });

                document.querySelectorAll('[contenteditable="true"]').forEach(el => {
                    el.addEventListener('input', function() {
                        const slideEl = this.closest('.swiper-slide');
                        if (!slideEl) return;
                        const idx = +slideEl.dataset.index;
                        const slide = bookData.slides[idx];
                        if (!slide) return;
                        let field = null;
                        if (this.classList.contains('love-title')) field = 'title';
                        else if (this.classList.contains('love-message')) field = 'message';
                        else if (this.classList.contains('love-signature')) field = 'signature';
                        else if (this.classList.contains('insta-text')) field = slide.content !== undefined ? 'content' : 'message';
                        if (field) {
                            slide[field] = this.innerText;
                            this.dataset.fulltext = this.innerText;
                            saveData();
                        }
                    }, { passive: true });
                    el.addEventListener('blur', saveData, { passive: true });
                });
                applySettings();
            }

            let swiperInstance = null;

            function initSwiper() {
                if (swiperInstance) {
                    swiperInstance.destroy(true, true);
                    swiperInstance = null;
                }
                swiperInstance = new Swiper('#main-swiper', {
                    effect: 'cards',
                    grabCursor: true,
                    cardsEffect: { perSlideOffset: 8, perSlideRotate: 2, rotate: true, slideShadows: false },
                    on: {
                        slideChangeTransitionEnd: function() {
                            triggerTypewriterOnActiveSlide();
                        }
                    }
                });
            }

            function applySettings() {
                const s = bookData.settings;
                document.getElementById('book-container').style.background = `radial-gradient(ellipse at 50% 60%, ${s.backgroundColor}, #060204)`;
                document.querySelectorAll('.swiper-slide').forEach(slide => {
                    slide.style.fontFamily = s.fontFamily + ', sans-serif';
                    slide.style.fontSize = s.fontSize + 'px';
                });
            }

            function syncSettingsUI() {
                const s = bookData.settings;
                document.getElementById('font-size-slider').value = s.fontSize;
                document.getElementById('font-family-select').value = s.fontFamily;
                document.getElementById('bg-color-picker').value = s.backgroundColor;
            }

            document.getElementById('font-size-slider').addEventListener('input', (e) => {
                bookData.settings.fontSize = e.target.value;
                applySettings();
                saveData();
            });
            document.getElementById('font-family-select').addEventListener('change', (e) => {
                bookData.settings.fontFamily = e.target.value;
                applySettings();
                saveData();
            });
            document.getElementById('bg-color-picker').addEventListener('input', (e) => {
                bookData.settings.backgroundColor = e.target.value;
                applySettings();
                saveData();
            });

            document.getElementById('settings-toggle').addEventListener('click', () => {
                document.getElementById('settings-panel').classList.toggle('open');
            });
            document.getElementById('settings-close-btn').addEventListener('click', () => {
                document.getElementById('settings-panel').classList.remove('open');
            });

            document.getElementById('add-page-btn').addEventListener('click', () => {
                bookData.slides.splice(bookData.slides.length - 1, 0, {
                    type: 'insta_card', content: 'ذكرى جديدة جميلة...', photos: []
                });
                saveData();
                renderSlides();
                initSwiper();
                swiperInstance.slideTo(bookData.slides.length - 2);
            });

            document.getElementById('add-love-message-btn').addEventListener('click', () => {
                bookData.slides.splice(bookData.slides.length - 1, 0, {
                    type: 'love_message', title: 'رسالة جديدة', message: 'اكتب رسالتك هنا...', signature: 'مع حبي ♥'
                });
                saveData();
                renderSlides();
                initSwiper();
                swiperInstance.slideTo(bookData.slides.length - 2);
            });

            document.getElementById('remove-page-btn').addEventListener('click', () => {
                if (bookData.slides.length > 2) {
                    bookData.slides.splice(bookData.slides.length - 2, 1);
                    saveData();
                    renderSlides();
                    initSwiper();
                }
            });

            document.getElementById('replay-typewriter-btn').addEventListener('click', () => {
                triggerTypewriterOnActiveSlide();
            });

            let targetSlideUpload = null;
            window.triggerUpload = function(slideIdx) {
                targetSlideUpload = slideIdx;
                document.getElementById('photo-upload-input').click();
            };

            document.getElementById('photo-upload-input').addEventListener('change', function(e) {
                const files = e.target.files;
                if (!files || !files.length || targetSlideUpload === null) return;
                const slide = bookData.slides[targetSlideUpload];
                if (!slide || !slide.photos) return;

                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        slide.photos.push({ id: 'p_' + Date.now(), url: evt.target.result });
                        saveData();
                        renderSlides();
                        initSwiper();
                        swiperInstance.slideTo(targetSlideUpload);
                    };
                    reader.readAsDataURL(file);
                });
            });

            window.deletePhoto = function(slideIdx, photoIdx) {
                if (bookData.slides[slideIdx] && bookData.slides[slideIdx].photos) {
                    bookData.slides[slideIdx].photos.splice(photoIdx, 1);
                    saveData();
                    renderSlides();
                    initSwiper();
                    swiperInstance.slideTo(slideIdx);
                }
            };

            const music = document.getElementById('backgroundMusic');
            const musicBtn = document.getElementById('music-toggle');
            musicBtn.addEventListener('click', () => {
                if (music.paused) {
                    music.play();
                    musicBtn.classList.add('playing');
                    musicBtn.innerText = '❚❚';
                } else {
                    music.pause();
                    musicBtn.classList.remove('playing');
                    musicBtn.innerText = '▶';
                }
            });

            document.getElementById('enter-btn').addEventListener('click', () => {
                window.stopMatrix();
                document.getElementById('countdown-overlay').style.display = 'none';
                document.getElementById('enter-btn').style.display = 'none';
                
                const book = document.getElementById('book-container');
                book.classList.add('active');
                
                document.getElementById('music-toggle').classList.add('show');
                document.getElementById('settings-toggle').classList.add('show');
                document.getElementById('back-to-cover-btn').classList.add('show');
                document.getElementById('close-book-btn').classList.add('show');

                renderSlides();
                initSwiper();
                setTimeout(triggerTypewriterOnActiveSlide, 500);
            });

            document.getElementById('back-to-cover-btn').addEventListener('click', () => {
                if (swiperInstance) swiperInstance.slideTo(0);
            });

            document.getElementById('close-book-btn').addEventListener('click', () => {
                document.getElementById('book-container').classList.remove('active');
                document.getElementById('music-toggle').classList.remove('show');
                document.getElementById('settings-toggle').classList.remove('show');
                document.getElementById('back-to-cover-btn').classList.remove('show');
                document.getElementById('close-book-btn').classList.remove('show');
                
                if(!music.paused) {
                    music.pause();
                    musicBtn.classList.remove('playing');
                    musicBtn.innerText = '▶';
                }
                
                window.startMatrix();
                document.getElementById('enter-btn').style.display = 'block';
            });

            loadSavedData();
            setTimeout(() => {
                const enterBtn = document.getElementById('enter-btn');
                enterBtn.style.display = 'block';
                setTimeout(() => enterBtn.classList.add('show'), 50);
            }, 1000);

        })();
    </script>
</body>
</html>
